{% extends "base.html" %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header">
        <h1><i class="fas fa-bullhorn"></i> {{ post.title }}</h1>
        <a href="{{ url_for('post.list_posts') }}" class="btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Announcements
        </a>
    </div>

    <div class="post-details-card">
        <div class="post-meta">
            <div class="meta-item">
                <i class="fas fa-clock"></i>
                <span>Posted {{ post.created_at|time_ago }}</span>
            </div>
        </div>
        
        <div class="post-content">
            {{ post.content }}
        </div>
    </div>
</div>

<style>
.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.page-header h1 {
    font-size: 32px;
    color: #333;
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0;
}

.btn-secondary {
    padding: 12px 24px;
    background: white;
    color: #667eea;
    border: 2px solid #667eea;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
}

.btn-secondary:hover {
    background: #667eea;
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
}

.post-details-card {
    background: white;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    transition: all 0.3s ease;
}

.post-details-card:hover {
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
}

.post-meta {
    display: flex;
    gap: 20px;
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 2px solid #f0f0f0;
}

.meta-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #666;
    font-size: 14px;
}

.meta-item i {
    color: #667eea;
}

.post-content {
    color: #333;
    font-size: 16px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-wrap: break-word;
}

@media (max-width: 768px) {
    .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .page-header h1 {
        font-size: 24px;
    }
}
</style>
{% endblock %}
